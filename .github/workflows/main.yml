name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew :module:assembleRelease
    - name: Prepare Module Zip
      run: |
        mkdir -p module_output
        cp module/build/outputs/apk/release/module-release-unsigned.apk module_output/
        cp module/template/magisk_module/* module_output/ -r
        cd module_output
        zip -r ../ZygiskModule.zip *
    - name: Upload Module
      uses: actions/upload-artifact@v4
      with:
        name: Zygisk-Module
        path: ZygiskModule.zip
